<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Admin - Noah Mirosch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 0.9375rem;
        }

        .login-form, .upload-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input[type="password"],
        input[type="file"] {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        input[type="password"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.08);
        }

        input[type="file"] {
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            padding: 8px 16px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            margin-right: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.5);
        }

        button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .stats-preview {
            margin-top: 24px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
        }

        .stats-preview h3 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--accent-purple);
            font-weight: 600;
        }

        .logout-btn {
            margin-top: 20px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Login Form -->
            <div id="loginSection">
                <h1>Admin Login</h1>
                <p class="subtitle">Enter password to update resume data</p>
                <div id="loginMessage"></div>
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required autocomplete="current-password">
                    </div>
                    <button type="submit">Login</button>
                </form>
            </div>

            <!-- Upload Form -->
            <div id="uploadSection" class="hidden">
                <h1>Update Resume Data</h1>
                <p class="subtitle">Upload your flight data PDF to update the resume</p>
                <div id="uploadMessage"></div>
                <form class="upload-form" id="uploadForm">
                    <div class="form-group">
                        <label for="pdfFile">Flight Data PDF</label>
                        <input type="file" id="pdfFile" accept=".pdf" required>
                    </div>
                    <button type="submit" id="uploadBtn">Parse and Preview</button>
                </form>

                <div id="statsPreview" class="hidden">
                    <div class="stats-preview">
                        <h3>Parsed Flight Data</h3>
                        <div id="statsContent"></div>
                    </div>
                    <button id="updateResumeBtn" style="margin-top: 20px; width: 100%;">Update Resume</button>
                </div>

                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Set PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let parsedData = null;

        // Check if already logged in
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            showUploadSection();
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                // Call Vercel serverless function for authentication only
                const response = await fetch('https://password-nine-weld.vercel.app/api/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password })
                });

                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    showUploadSection();
                    showMessage('loginMessage', 'Login successful!', 'success');
                    setTimeout(() => {
                        document.getElementById('loginMessage').innerHTML = '';
                    }, 2000);
                } else {
                    showMessage('loginMessage', 'Incorrect password', 'error');
                }
            } catch (error) {
                showMessage('loginMessage', 'Error connecting to authentication server', 'error');
            }
        });

        // Upload form handler
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('pdfFile');
            const file = fileInput.files[0];

            if (!file) {
                showMessage('uploadMessage', 'Please select a PDF file', 'error');
                return;
            }

            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('uploadBtn').textContent = 'Parsing PDF...';

            try {
                const text = await extractTextFromPDF(file);
                parsedData = parseFlightData(text);
                displayStats(parsedData);
                document.getElementById('statsPreview').classList.remove('hidden');
                showMessage('uploadMessage', 'PDF parsed successfully! Review and click "Update Resume" to save.', 'success');
            } catch (error) {
                showMessage('uploadMessage', 'Error parsing PDF: ' + error.message, 'error');
            } finally {
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('uploadBtn').textContent = 'Parse and Preview';
            }
        });

        // Update resume button
        document.getElementById('updateResumeBtn').addEventListener('click', () => {
            if (parsedData) {
                updateResume(parsedData);
                showMessage('uploadMessage', 'Resume data updated! You can now close this page.', 'success');
            }
        });

        // Logout button
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('adminLoggedIn');
            document.getElementById('uploadSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('password').value = '';
            document.getElementById('statsPreview').classList.add('hidden');
            document.getElementById('uploadMessage').innerHTML = '';
        });

        function showUploadSection() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('uploadSection').classList.remove('hidden');
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="message ${type}">${message}</div>`;
        }

        async function extractTextFromPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = '';

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + '\n';
            }

            return fullText;
        }

        function parseFlightData(text) {
            console.log("Raw PDF text:", text); // Debug logging
            
            const data = {
                totalTime: 0,
                pic: 0,
                turbine: 0,
                night: 0,
                multiEngine: 0,
                aircraft: []
            };

            // Step 1: Extract the Grand Totals line and parse all numbers
            // The line looks like: "Grand Totals 578 Flights: 206.7 575.5 1.3 20.8 173.3 35.7 141.3 3.5 60.7 1.0 10.1 8.0 174.4 42.5 1239.1 466"
            const grandTotalsLine = text.match(/Grand Totals[\s\S]*?(\d+)\s+Flights:([\s\d.]+)/);
            
            if (grandTotalsLine) {
                // Extract all numbers after "Flights:"
                const numbersText = grandTotalsLine[2];
                const numbers = numbersText.trim().split(/\s+/).map(n => parseFloat(n));
                
                console.log("Extracted numbers:", numbers);
                
                // Based on PDF structure (16 numbers total):
                // [0] = 206.7 (Single Day Dual)
                // [1] = 575.5 (Single Day PIC/P1) ✓ PIC
                // [2] = 1.3 (Single Day SIC/P2) ✓ PIC
                // [3] = 20.8 (Single Day P1 U/S)
                // [4] = 173.3 (Single Night Dual) ✓ PIC
                // [5] = 35.7 (Single Night PIC/P1)
                // [6] = 141.3 (Single Night SIC/P2) ✓ PIC
                // [7] = 3.5 (Single Night P1 U/S)
                // [8] = 60.7 (Multi Day Dual) ✓ PIC
                // [9] = 1.0 (Multi Day PIC/P1)
                // [10] = 10.1 (Multi Day SIC/P2) ✓ PIC
                // [11] = 8.0 (Multi Day P1 U/S)
                // [12] = 174.4 (IFR Actual)
                // [13] = 42.5 (Simulator)
                // [14] = 1239.1 (Total Time) ✓
                // [15] = 466 (Total Landings)
                
                if (numbers.length >= 15) {
                    data.totalTime = numbers[14];  // 1239.1
                    
                    // PIC: 575.5, 1.3, 173.3, 141.3, 60.7, 10.1
                    data.pic = numbers[1] + numbers[2] + numbers[4] + numbers[6] + numbers[8] + numbers[10];
                    
                    // Night: Single Night columns (indices 4,5,6,7) + Multi Night columns
                    // But we don't have separate Multi Night in this structure
                    data.night = numbers[4] + numbers[5] + numbers[6] + numbers[7];
                }
            }

            // Step 2: Parse individual aircraft
            // The PDF text might have spaces between characters, so we need to be flexible
            // Look for patterns like: "SR22 Total" or "S R 2 2 Total" or "SR 22 Total"
            
            const aircraftData = {};
            
            // Split text into lines
            const lines = text.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Look for "Total (X Flights):" pattern
                if (line.includes('Total') && line.includes('Flights)')) {
                    // Try to extract aircraft type from this line or previous lines
                    // Pattern: might be "SR22 Total (267 Flights):" or spread across lines
                    
                    // Method 1: Aircraft code is in the same line
                    let typeMatch = line.match(/([A-Z][A-Z0-9]{2,3})\s+Total\s+\((\d+)\s+Flights\)/);
                    
                    if (!typeMatch) {
                        // Method 2: Aircraft code might be in previous line
                        const prevLine = i > 0 ? lines[i - 1] : '';
                        const combinedLine = prevLine + ' ' + line;
                        typeMatch = combinedLine.match(/([A-Z][A-Z0-9]{2,3})\s+Total\s+\((\d+)\s+Flights\)/);
                    }
                    
                    if (!typeMatch) {
                        // Method 3: Try without spaces - look for consecutive capital letters and numbers
                        const cleaned = line.replace(/\s+/g, '');
                        typeMatch = cleaned.match(/([A-Z][A-Z0-9]{2,3})Total\((\d+)Flights\)/);
                    }
                    
                    if (typeMatch) {
                        const type = typeMatch[1];
                        
                        // Now find the hours - should be the rest of the line after "Flights):"
                        const afterFlights = line.split('Flights):')[1] || line.split('Flights\):')[1];
                        
                        if (afterFlights) {
                            // Extract all numbers from after the Flights marker
                            const numbers = afterFlights.match(/[\d.]+/g);
                            
                            if (numbers && numbers.length >= 2) {
                                const allNumbers = numbers.map(n => parseFloat(n));
                                // Second to last number is total hours, last is landings
                                const hours = allNumbers[allNumbers.length - 2];
                                
                                console.log(`Found aircraft ${type}: ${hours} hours`);
                                
                                // Skip SIM and zero hours
                                if (type !== 'SIM' && hours > 0) {
                                    aircraftData[type] = hours;
                                }
                            }
                        }
                    }
                }
                
                // Alternative pattern: "for Period" followed by "Total" on next lines
                if (line.includes('for Period')) {
                    const typeMatch = line.match(/([A-Z][A-Z0-9]{2,3})\s+for Period/);
                    if (typeMatch) {
                        const type = typeMatch[1];
                        
                        // Look for the Total line in the next few lines
                        for (let j = i + 1; j < Math.min(i + 5, lines.length); j++) {
                            if (lines[j].includes(type) && lines[j].includes('Total')) {
                                const numbers = lines[j].match(/[\d.]+/g);
                                if (numbers && numbers.length >= 2) {
                                    const allNumbers = numbers.map(n => parseFloat(n));
                                    const hours = allNumbers[allNumbers.length - 2];
                                    
                                    console.log(`Found aircraft ${type} (from for Period): ${hours} hours`);
                                    
                                    if (type !== 'SIM' && hours > 0 && !aircraftData[type]) {
                                        aircraftData[type] = hours;
                                    }
                                    break;
                                }
                            }
                        }
                    }
                }
            }
            
            // Convert to array and sort
            data.aircraft = Object.entries(aircraftData)
                .map(([type, hours]) => ({ type, hours }))
                .sort((a, b) => b.hours - a.hours);
            
            console.log("Parsed aircraft:", data.aircraft);

            // Step 3: Calculate turbine hours
            // Turbine aircraft: P46T (Piper Meridian) and SF34 (Saab 340)
            const turbineTypes = ['P46T', 'SF34'];
            data.turbine = data.aircraft
                .filter(a => turbineTypes.includes(a.type))
                .reduce((sum, a) => sum + a.hours, 0);

            // Step 4: Calculate multi-engine hours
            const multiEngineTypes = ['PA31', 'PA34', 'PA44', 'BE55', 'BE58', 'SF34', 'AC11'];
            data.multiEngine = data.aircraft
                .filter(a => multiEngineTypes.includes(a.type))
                .reduce((sum, a) => sum + a.hours, 0);

            console.log("Final parsed data:", data);
            
            return data;
        }

        function displayStats(data) {
            const content = document.getElementById('statsContent');
            content.innerHTML = `
                <div class="stat-row">
                    <span class="stat-label">Total Time:</span>
                    <span class="stat-value">${data.totalTime.toFixed(1)} hrs</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">PIC:</span>
                    <span class="stat-value">${data.pic.toFixed(1)} hrs</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Turbine:</span>
                    <span class="stat-value">${data.turbine.toFixed(1)} hrs</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Night:</span>
                    <span class="stat-value">${data.night.toFixed(1)} hrs</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Multi Engine:</span>
                    <span class="stat-value">${data.multiEngine.toFixed(1)} hrs</span>
                </div>
                <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                    <strong style="color: var(--text-primary);">Top Aircraft (${data.aircraft.length} types):</strong>
                    ${data.aircraft.slice(0, 9).map(a => `
                        <div class="stat-row">
                            <span class="stat-label">${a.type}:</span>
                            <span class="stat-value">${a.hours.toFixed(1)} hrs</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function updateResume(data) {
            // Store data in localStorage to be accessed by the resume page
            const resumeData = {
                totalTime: data.totalTime.toFixed(1),
                pic: data.pic.toFixed(1),
                turbine: data.turbine.toFixed(1),
                night: data.night.toFixed(1),
                multiEngine: data.multiEngine.toFixed(1),
                aircraft: data.aircraft.slice(0, 9).map(a => ({
                    type: a.type,
                    hours: a.hours.toFixed(1)
                })),
                lastUpdated: new Date().toLocaleDateString('en-GB')
            };

            localStorage.setItem('noahResumeData', JSON.stringify(resumeData));
        }
    </script>
</body>
</html>
