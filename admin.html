<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Admin - Noah Mirosch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--glass-border);
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--accent-purple);
            border-bottom-color: var(--accent-purple);
        }

        /* Tab content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        /* Form elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="url"],
        input[type="file"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: var(--glass-bg);
            box-shadow: none;
        }

        .btn-danger {
            background: var(--accent-red);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        /* Lists */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        /* Drag handle */
        .drag-handle {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 4px 0;
            cursor: grab;
            flex-shrink: 0;
            opacity: 0.35;
            transition: opacity 0.2s;
            align-self: center;
        }

        .drag-handle:hover {
            opacity: 0.7;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .drag-handle span {
            display: block;
            width: 16px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 1px;
        }

        /* Dragging state */
        .list-item.dragging {
            opacity: 0.4;
            background: rgba(168, 85, 247, 0.08);
            border-color: rgba(168, 85, 247, 0.3);
        }

        /* Drop target highlight */
        .list-item.drag-over {
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.1);
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .list-item-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .list-item-actions {
            display: flex;
            gap: 8px;
        }

        /* Messages */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
        }

        .hidden {
            display: none !important;
        }

        /* Login screen */
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-red);
            transform: none;
            box-shadow: none;
        }

        /* Grid layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        /* Flight data specific */
        .stats-preview {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--text-primary);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div id="loginSection" class="login-container">
        <div class="card">
            <h1>Resume Admin</h1>
            <p class="subtitle" style="text-align: center; margin-bottom: 24px;">Enter password to continue</p>
            <div id="loginMessage"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autofocus>
                </div>
                <button type="submit" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <div id="adminSection" class="hidden">
        <button class="logout-btn" id="logoutBtn">Logout</button>
        
        <div class="container">
            <div class="header">
                <h1>Resume Admin Panel</h1>
                <p class="subtitle">Manage your resume content</p>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="flight-data">Flight Data</button>
                <button class="tab" data-tab="education">Education</button>
                <button class="tab" data-tab="contact">Contact</button>
                <button class="tab" data-tab="about">About</button>
                <button class="tab" data-tab="experience">Experience</button>
            </div>

            <div id="flight-data" class="tab-content active">
                <div class="card">
                    <h2>Upload Flight Data PDF</h2>
                    <div id="flightDataMessage"></div>
                    <form id="uploadForm">
                        <div class="form-group">
                            <label for="pdfFile">Flight Data PDF</label>
                            <input type="file" id="pdfFile" accept=".pdf" required>
                        </div>
                        <button type="submit" id="uploadBtn">Parse and Preview</button>
                    </form>

                    <div id="statsPreview" class="hidden">
                        <div class="stats-preview">
                            <h3>Parsed Flight Data</h3>
                            <div id="statsContent"></div>
                        </div>
                        <button id="updateFlightDataBtn" style="margin-top: 20px; width: 100%;">Save Flight Data</button>
                    </div>
                </div>
            </div>

            <div id="education" class="tab-content">
                <div class="card">
                    <h2>Education</h2>
                    <div id="educationMessage"></div>
                    
                    <div id="educationList" class="item-list"></div>
                    
                    <button id="addEducationBtn" class="btn-secondary" style="margin-top: 20px; width: 100%;">+ Add Education</button>
                    
                    <div id="educationForm" class="hidden" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border);">
                        <h3 style="margin-bottom: 16px;">Add/Edit Education</h3>
                        <div class="form-group">
                            <label>Degree/Certificate</label>
                            <input type="text" id="eduDegree" placeholder="e.g., B. Aviation Management">
                        </div>
                        <div class="form-group">
                            <label>Institution</label>
                            <input type="text" id="eduInstitution" placeholder="e.g., Griffith University, Brisbane">
                        </div>
                        <div class="form-group">
                            <label>Year/Period</label>
                            <input type="text" id="eduYear" placeholder="e.g., 2022 – 2026">
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button id="saveEducationBtn">Save</button>
                            <button id="cancelEducationBtn" class="btn-secondary">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="contact" class="tab-content">
                <div class="card">
                    <h2>Contact Information</h2>
                    <div id="contactMessage"></div>
                    
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="contactPhone" placeholder="0488 759 979">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="contactEmail" placeholder="[email protected]">
                        </div>
                        <div class="form-group">
                            <label>LinkedIn</label>
                            <input type="text" id="contactLinkedIn" placeholder="noah-mirosch">
                        </div>
                    </div>
                    
                    <button id="saveContactBtn" style="width: 100%; margin-top: 20px;">Save Contact Info</button>
                </div>
            </div>

            <div id="about" class="tab-content">
                <div class="card">
                    <h2>About Section</h2>
                    <div id="aboutMessage"></div>
                    
                    <div class="form-group">
                        <label>About Text</label>
                        <textarea id="aboutText" placeholder="Write your professional summary here..." rows="8"></textarea>
                    </div>
                    
                    <button id="saveAboutBtn" style="width: 100%;">Save About</button>
                </div>
            </div>

            <div id="experience" class="tab-content">
                <div class="card">
                    <h2>Work Experience</h2>
                    <div id="experienceMessage"></div>
                    
                    <div id="experienceList" class="item-list"></div>
                    
                    <button id="addExperienceBtn" class="btn-secondary" style="margin-top: 20px; width: 100%;">+ Add Experience</button>
                    
                    <div id="experienceForm" class="hidden" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border);">
                        <h3 style="margin-bottom: 16px;">Add/Edit Experience</h3>
                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text" id="expTitle" placeholder="e.g., Multi-Engine Line Pilot">
                        </div>
                        <div class="form-group">
                            <label>Company & Location</label>
                            <input type="text" id="expCompany" placeholder="e.g., FLY2HEALTH SYDNEY, BANKSTOWN">
                        </div>
                        <div class="form-group">
                            <label>Date Range</label>
                            <input type="text" id="expDate" placeholder="e.g., January 2025 – Current">
                        </div>
                        <div class="form-group">
                            <label>Responsibilities (one per line)</label>
                            <textarea id="expResponsibilities" placeholder="Operating a PA-31
Flying single pilot IFR
Operating to a wide number of airfields throughout NSW" rows="6"></textarea>
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button id="saveExperienceBtn">Save</button>
                            <button id="cancelExperienceBtn" class="btn-secondary">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <button id="publishBtn" style="width: 100%; padding: 16px; font-size: 1rem;">
                    🚀 Publish All Changes to Resume
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Set PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // State management
        let resumeData = {
            flightData: null,
            education: [],
            contact: {},
            about: '',
            experience: []
        };

        let currentEditIndex = -1;
        let currentEditType = null;

        // Check if logged in
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            showAdminSection();
            loadExistingData();
        }

        // Login handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('https://password-nine-weld.vercel.app/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    sessionStorage.setItem('adminPassword', password);
                    showAdminSection();
                    loadExistingData();
                } else {
                    showMessage('loginMessage', 'Invalid password', 'error');
                }
            } catch (error) {
                showMessage('loginMessage', 'Connection error', 'error');
            }
        });

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.clear();
            location.reload();
        });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        function showAdminSection() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => { element.innerHTML = ''; }, 5000);
        }

        // Load existing data from API
        async function loadExistingData() {
            try {
                const response = await fetch('https://password-nine-weld.vercel.app/api/resume-data');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Load Education
                    if (data.education && data.education.length > 0) {
                        resumeData.education = data.education;
                        renderEducationList();
                    } else {
                        // Load default education if none exists
                        resumeData.education = [
                            {
                                degree: 'B. Aviation Management',
                                institution: 'Griffith University, Brisbane',
                                year: '2022 – 2026'
                            },
                            {
                                degree: 'ATPL (Frozen)',
                                institution: 'AFT, Sunshine Coast',
                                year: '2025 – 2026'
                            },
                            {
                                degree: 'CPL',
                                institution: 'Archerfield',
                                year: '2022'
                            }
                        ];
                        renderEducationList();
                    }
                    
                    // Load Contact
                    if (data.contact && Object.keys(data.contact).length > 0) {
                        resumeData.contact = data.contact;
                        document.getElementById('contactPhone').value = data.contact.phone || '';
                        document.getElementById('contactEmail').value = data.contact.email || '';
                        document.getElementById('contactLinkedIn').value = data.contact.linkedin || '';
                    } else {
                        // Load default contact if none exists
                        resumeData.contact = {
                            phone: '0488 759 979',
                            email: '[email protected]',
                            linkedin: 'noah-mirosch'
                        };
                        document.getElementById('contactPhone').value = resumeData.contact.phone;
                        document.getElementById('contactEmail').value = resumeData.contact.email;
                        document.getElementById('contactLinkedIn').value = resumeData.contact.linkedin;
                    }
                    
                    // Load About
                    if (data.about) {
                        resumeData.about = data.about;
                        document.getElementById('aboutText').value = data.about;
                    } else {
                        // Load default about if none exists
                        resumeData.about = 'I am an Aviation professional with a strong background in both IFR flying and operations management. I have experience in flying large piston twins such as the Piper Chieftain and single engine turbine aircraft such as the Piper Meridian. I\'m also skilled in creating efficient business processes, leading teams, and managing aircraft operations. I\'m proficient in utilising technology for data analysis and process improvement. I am committed to maintaining high standards of safety and compliance in all aspects of aviation. Air safety starts on the ground.';
                        document.getElementById('aboutText').value = resumeData.about;
                    }
                    
                    // Load Experience
                    if (data.experience && data.experience.length > 0) {
                        resumeData.experience = data.experience;
                        renderExperienceList();
                    } else {
                        // Load default experience if none exists
                        resumeData.experience = [
                            {
                                title: 'Multi-Engine Line Pilot',
                                company: 'FLY2HEALTH SYDNEY, BANKSTOWN',
                                date: 'January 2025 – Current',
                                responsibilities: [
                                    'Operating a PA-31',
                                    'Flying single pilot IFR',
                                    'Operating to a wide number of airfields throughout NSW'
                                ]
                            },
                            {
                                title: 'Pilot / Python Development Manager',
                                company: 'WESTAL WINDOWS, ORANGE',
                                date: 'May 2023 – December 2024',
                                responsibilities: [
                                    'Operating a SR22 and PA46 privately from Orange airport to various ports throughout NSW, QLD and VIC',
                                    'Creating business processes and teams of up to 10 people',
                                    'Flying single pilot under the IFR',
                                    'Managing aircraft airworthiness, maintenance and presentation',
                                    'Managing passengers and freight',
                                    'Leading and managing a team of Python developers',
                                    'Project management, stakeholder engagement and staff training',
                                    'High level technical Python skills'
                                ]
                            },
                            {
                                title: 'Operations Manager / Pilot',
                                company: 'TEAM AVIATION, ARCHERFIELD',
                                date: 'April 2022 – May 2023',
                                responsibilities: [
                                    'Operating the Cirrus SR22 and SR20 fleet for maintenance flights and positioning',
                                    'Managing and leading small teams',
                                    'AD-HOC 135 charter duties as required',
                                    'Running day-to-day operations',
                                    'Managing schedules and staff to optimise aircraft utilisation and reduce staff downtimes',
                                    'Creating staff rosters compliant to CAO 48.1',
                                    'Management of the office, hangar, staff and equipment',
                                    'Project management including integration plans for C208B RPT and charter',
                                    'Writing and document control of operations manuals and SOP manuals'
                                ]
                            }
                        ];
                        renderExperienceList();
                    }
                    
                    console.log('Loaded existing data:', resumeData);
                }
            } catch (error) {
                console.error('Error loading data:', error);
                // Load defaults even if API fails
                loadDefaultData();
            }
        }
        
        function loadDefaultData() {
            // Set all default data if API fails
            resumeData.education = [
                {
                    degree: 'B. Aviation Management',
                    institution: 'Griffith University, Brisbane',
                    year: '2022 – 2026'
                },
                {
                    degree: 'ATPL (Frozen)',
                    institution: 'AFT, Sunshine Coast',
                    year: '2025 – 2026'
                },
                {
                    degree: 'CPL',
                    institution: 'Archerfield',
                    year: '2022'
                }
            ];
            renderEducationList();
            
            resumeData.contact = {
                phone: '0488 759 979',
                email: '[email protected]',
                linkedin: 'noah-mirosch'
            };
            document.getElementById('contactPhone').value = resumeData.contact.phone;
            document.getElementById('contactEmail').value = resumeData.contact.email;
            document.getElementById('contactLinkedIn').value = resumeData.contact.linkedin;
            
            resumeData.about = 'I am an Aviation professional with a strong background in both IFR flying and operations management. I have experience in flying large piston twins such as the Piper Chieftain and single engine turbine aircraft such as the Piper Meridian. I\'m also skilled in creating efficient business processes, leading teams, and managing aircraft operations. I\'m proficient in utilising technology for data analysis and process improvement. I am committed to maintaining high standards of safety and compliance in all aspects of aviation. Air safety starts on the ground.';
            document.getElementById('aboutText').value = resumeData.about;
            
            resumeData.experience = [
                {
                    title: 'Multi-Engine Line Pilot',
                    company: 'FLY2HEALTH SYDNEY, BANKSTOWN',
                    date: 'January 2025 – Current',
                    responsibilities: [
                        'Operating a PA-31',
                        'Flying single pilot IFR',
                        'Operating to a wide number of airfields throughout NSW'
                    ]
                },
                {
                    title: 'Pilot / Python Development Manager',
                    company: 'WESTAL WINDOWS, ORANGE',
                    date: 'May 2023 – December 2024',
                    responsibilities: [
                        'Operating a SR22 and PA46 privately from Orange airport to various ports throughout NSW, QLD and VIC',
                        'Creating business processes and teams of up to 10 people',
                        'Flying single pilot under the IFR',
                        'Managing aircraft airworthiness, maintenance and presentation',
                        'Managing passengers and freight',
                        'Leading and managing a team of Python developers',
                        'Project management, stakeholder engagement and staff training',
                        'High level technical Python skills'
                    ]
                },

        async function extractTextFromPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = '';

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + '\n';
            }

            return fullText;
        }

        function parseFlightData(text) {
            console.log("Raw PDF text:", text);
            
            const data = {
                totalTime: 0,
                pic: 0,
                turbine: 0,
                night: 0,
                multiEngine: 0,
                ifr: 0,
                multiPIC: 0,
                aircraft: []
            };

            console.log("Splitting text into tokens...");
            const tokens = text.split(/\s+/);
            
            for (let i = 0; i < tokens.length - 2; i++) {
                const token = tokens[i];
                
                if (/^[A-Z][A-Z0-9]{2,3}$/.test(token)) {
                    const skipWords = ['SIM', 'Dual', 'Night', 'Flights', 'Total', 'Grand', 'PAGE', 'Day', 'Multi'];
                    if (skipWords.includes(token)) continue;
                    
                    const flights = parseInt(tokens[i + 1]);
                    const hours = parseFloat(tokens[i + 2]);
                    
                    if (!isNaN(flights) && !isNaN(hours) && 
                        flights > 0 && flights < 1000 && 
                        hours > 0 && hours < 1000) {
                        
                        console.log(`Found: ${token} = ${hours} hours (${flights} flights)`);
                        
                        if (!data.aircraft.find(a => a.type === token)) {
                            data.aircraft.push({ type: token, hours: hours });
                        }
                    }
                }
            }

            const grandTotalsMatch = text.match(/Grand Totals\s+(\d+)\s+([\d.\s]+)/);
            
            if (grandTotalsMatch) {
                const numbersText = grandTotalsMatch[2];
                const numbers = numbersText.trim().split(/\s+/).map(n => parseFloat(n));
                
                console.log("Grand Totals numbers:", numbers);
                console.log("Numbers array length:", numbers.length);
                
                if (numbers.length >= 13) {
                    data.totalTime = numbers[0];
                    data.pic = numbers[2] + numbers[4] + numbers[6] + numbers[8] + numbers[10];
                    data.night = numbers[4] + numbers[5] + numbers[6] + numbers[7];
                    data.ifr = numbers[12] || 0;
                    data.multiPIC = (numbers[6] || 0) + (numbers[10] || 0);
                    
                    console.log(`Parsed: Total=${data.totalTime}, PIC=${data.pic}, Night=${data.night}, IFR=${data.ifr}, Multi PIC=${data.multiPIC}`);
                    console.log(`Multi PIC calculation: numbers[6]=${numbers[6]} + numbers[10]=${numbers[10]} = ${data.multiPIC}`);
                } else {
                    console.warn(`Not enough numbers in Grand Totals. Expected at least 13, got ${numbers.length}`);
                }
            }
            
            data.aircraft.sort((a, b) => b.hours - a.hours);
            
            console.log("Final aircraft list:", data.aircraft);

            const turbineTypes = ['P46T', 'SF34'];
            data.turbine = data.aircraft
                .filter(a => turbineTypes.includes(a.type))
                .reduce((sum, a) => sum + a.hours, 0);

            const multiEngineTypes = ['PA31', 'PA34', 'PA44', 'BE55', 'BE58', 'SF34', 'AC11'];
            data.multiEngine = data.aircraft
                .filter(a => multiEngineTypes.includes(a.type))
                .reduce((sum, a) => sum + a.hours, 0);

            console.log("Final data:", data);
            
            return data;
        }

        // ===== DRAG AND DROP =====
        function attachDragEvents(listId, dataKey) {
            const items = document.querySelectorAll(`#${listId} .list-item`);

            items.forEach(item => {
                // Desktop drag
                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', item.dataset.index);
                    item.classList.add('dragging');
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    document.querySelectorAll(`#${listId} .list-item`).forEach(el => el.classList.remove('drag-over'));
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const dragging = document.querySelector(`#${listId} .dragging`);
                    if (dragging && dragging !== item) {
                        item.classList.add('drag-over');
                    }
                });

                item.addEventListener('dragleave', () => {
                    item.classList.remove('drag-over');
                });

                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    item.classList.remove('drag-over');
                    const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                    const toIndex = parseInt(item.dataset.index);
                    reorderItem(dataKey, fromIndex, toIndex);
                });

                // Touch drag (mobile)
                const handle = item.querySelector('.drag-handle');
                let touchStartY = 0;
                let touchStartIndex = 0;
                let cloneEl = null;

                handle.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    touchStartY = e.touches[0].clientY;
                    touchStartIndex = parseInt(item.dataset.index);
                    item.classList.add('dragging');

                    // Create a visual clone to follow the finger
                    cloneEl = item.cloneNode(true);
                    cloneEl.style.position = 'fixed';
                    cloneEl.style.width = item.offsetWidth + 'px';
                    cloneEl.style.left = item.getBoundingClientRect().left + 'px';
                    cloneEl.style.top = item.getBoundingClientRect().top + 'px';
                    cloneEl.style.zIndex = '9999';
                    cloneEl.style.opacity = '0.85';
                    cloneEl.style.boxShadow = '0 8px 30px rgba(168,85,247,0.4)';
                    cloneEl.style.borderColor = 'rgba(168,85,247,0.6)';
                    cloneEl.style.pointerEvents = 'none';
                    cloneEl.style.transition = 'none';
                    document.body.appendChild(cloneEl);
                }, { passive: false });

                handle.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touchY = e.touches[0].clientY;

                    if (cloneEl) {
                        cloneEl.style.top = (touchY - item.offsetHeight / 2) + 'px';
                    }

                    // Find which item we're hovering over
                    const list = document.getElementById(listId);
                    const allItems = [...list.querySelectorAll('.list-item:not(.dragging)')];
                    allItems.forEach(el => el.classList.remove('drag-over'));

                    const hovered = allItems.find(el => {
                        const rect = el.getBoundingClientRect();
                        return touchY > rect.top && touchY < rect.bottom;
                    });

                    if (hovered) {
                        hovered.classList.add('drag-over');
                    }
                }, { passive: false });

                handle.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    item.classList.remove('dragging');
                    if (cloneEl) {
                        cloneEl.remove();
                        cloneEl = null;
                    }

                    const touchY = e.changedTouches[0].clientY;
                    const list = document.getElementById(listId);
                    const allItems = [...list.querySelectorAll('.list-item')];
                    allItems.forEach(el => el.classList.remove('drag-over'));

                    const hovered = allItems.find(el => {
                        const rect = el.getBoundingClientRect();
                        return touchY > rect.top && touchY < rect.bottom;
                    });

                    if (hovered) {
                        const toIndex = parseInt(hovered.dataset.index);
                        reorderItem(dataKey, touchStartIndex, toIndex);
                    }
                });
            });
        }

        function reorderItem(dataKey, fromIndex, toIndex) {
            if (fromIndex === toIndex) return;
            const arr = resumeData[dataKey];
            const moved = arr.splice(fromIndex, 1)[0];
            arr.splice(toIndex, 0, moved);

            if (dataKey === 'education') renderEducationList();
            if (dataKey === 'experience') renderExperienceList();
        }

            try {

                            type: a.type,
                            hours: a.hours.toFixed(1)
                        }))
                    };
                } else {
                    // No new PDF — pull existing flight data from API so we don't wipe it
                    const existingRes = await fetch('https://password-nine-weld.vercel.app/api/resume-data');
                    if (existingRes.ok) {
                        const existing = await existingRes.json();
                        flightFields = {
                            totalTime: existing.totalTime || '0.0',
                            pic: existing.pic || '0.0',
                            turbine: existing.turbine || '0.0',
                            night: existing.night || '0.0',
                            multiEngine: existing.multiEngine || '0.0',
                            ifr: existing.ifr || '0.0',
                            multiPIC: existing.multiPIC || '0.0',
                            aircraft: existing.aircraft || []
                        };
                    }
                }

                const dataToSave = {
                    ...flightFields,
                    education: resumeData.education,
                    contact: resumeData.contact,
                    about: resumeData.about,
                    experience: resumeData.experience,
                    lastUpdated: new Date().toLocaleDateString('en-GB')
                };

                const response = await fetch('https://password-nine-weld.vercel.app/api/resume-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, data: dataToSave })
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ Resume published successfully! Your changes are now live.');
                } else {
                    alert('❌ Error publishing: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                alert('❌ Connection error: ' + error.message);
            } finally {
                publishBtn.disabled = false;
                publishBtn.textContent = '🚀 Publish All Changes to Resume';
            }
        });
