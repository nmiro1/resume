<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noah Mirosch – Commercial Pilot & Aviation Professional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* BASE THEME (Default Glass) */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --accent-orange: #f97316;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; width: 100%; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            width: 100%;
        }

        /* Default Background Animation */
        body::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.1) 0%, transparent 60%);
            animation: float 20s ease-in-out infinite; pointer-events: none; z-index: 0;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 64px 40px; position: relative; z-index: 1; }
        @media (max-width: 768px) { .container { padding: 40px 20px; } }

        header { text-align: center; margin-bottom: 64px; animation: fadeInDown 0.8s ease-out; }
        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem); font-weight: 700; letter-spacing: -0.03em; margin-bottom: 16px;
            background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { font-size: clamp(1.1rem, 2.5vw, 1.4rem); color: var(--text-secondary); margin-bottom: 12px; }
        .credentials { font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; color: var(--text-muted); margin-top: 20px; }
        .credentials span { display: inline-block; padding: 8px 16px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; margin: 6px; backdrop-filter: blur(10px); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px; margin-bottom: 56px; }
        .card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 32px;
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover { transform: translateY(-4px); border-color: rgba(168, 85, 247, 0.3); }

        h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 24px; color: var(--text-primary); }

        .flight-time-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .stat.stat-primary { grid-column: span 2; background: rgba(168, 85, 247, 0.1); border: 2px solid rgba(168, 85, 247, 0.4); padding: 24px 20px; }
        .stat { text-align: center; padding: 20px; background: rgba(255, 255, 255, 0.03); border-radius: 12px; border: 1px solid var(--glass-border); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.75rem; font-weight: 600; background: linear-gradient(135deg, #a855f7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        
        .aircraft-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .aircraft-item { text-align: center; padding: 14px 10px; background: rgba(255, 255, 255, 0.03); border-radius: 10px; border: 1px solid var(--glass-border); font-size: 0.875rem; cursor: pointer; position: relative; }
        .aircraft-item:hover { background: rgba(59, 130, 246, 0.08); transform: translateY(-2px); }
        .aircraft-item.current-aircraft { background: rgba(168, 85, 247, 0.1); border: 2px solid rgba(168, 85, 247, 0.4); animation: pulse-glow 3s ease-in-out infinite; }
        .aircraft-type { font-family: 'JetBrains Mono', monospace; font-weight: 600; display: block; margin-bottom: 4px; }
        .aircraft-hours { font-size: 0.75rem; color: var(--text-muted); }

        /* Tooltip & Modal Styles - Keeping your complex tooltip logic */
        .aircraft-tooltip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-10px); background: #111; border: 1px solid #333; padding: 20px; width: 300px; border-radius: 12px; opacity: 0; visibility: hidden; transition: 0.2s; pointer-events: none; z-index: 99; }
        .aircraft-item:hover .aircraft-tooltip { opacity: 1; visibility: visible; }
        @media (max-width: 768px) { .aircraft-tooltip { display: none !important; } }
        .aircraft-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9999; padding: 20px; overflow-y: auto; }
        .aircraft-modal.active { display: block; }
        .modal-content { background: #111; border: 1px solid #333; border-radius: 16px; padding: 24px; margin-top: 60px; }
        .modal-close { position: fixed; top: 20px; right: 20px; width: 40px; height: 40px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }

        /* Content Sections */
        .contact-grid { display: grid; gap: 12px; }
        .contact-item { display: flex; align-items: center; padding: 14px; background: rgba(255, 255, 255, 0.03); border-radius: 10px; border: 1px solid var(--glass-border); }
        .contact-value { color: var(--text-secondary); text-decoration: none; margin-left: auto; }
        
        .section { margin-bottom: 56px; }
        .about-text { background: var(--glass-bg); border: 1px solid var(--glass-border); border-left: 3px solid #a855f7; padding: 32px; border-radius: 16px; color: var(--text-secondary); }
        .experience-item { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 32px; margin-bottom: 24px; position: relative; overflow: hidden; }
        .job-title { font-size: 1.25rem; font-weight: 600; color: #a855f7; margin-bottom: 8px; }
        .company { font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .date { font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 18px; font-family: 'JetBrains Mono', monospace; }
        .experience-item ul { list-style: none; margin-top: 12px; }
        .experience-item li { padding-left: 24px; margin-bottom: 10px; position: relative; color: var(--text-secondary); }
        .experience-item li::before { content: '→'; position: absolute; left: 4px; color: #a855f7; }

        /* ================= THEME: SWISS MINIMAL (Paper) ================= */
        body.theme-paper {
            --bg-primary: #ffffff;
            --bg-secondary: #f4f4f5;
            --glass-bg: #ffffff;
            --glass-border: #e4e4e7;
            --text-primary: #18181b;
            --text-secondary: #52525b;
            --text-muted: #a1a1aa;
        }
        body.theme-paper::before { display: none; }
        body.theme-paper .container { max-width: 800px; background: white; box-shadow: 0 0 50px rgba(0,0,0,0.05); min-height: 100vh; padding-top: 80px; }
        body.theme-paper .grid { display: flex; flex-direction: column; gap: 40px; }
        body.theme-paper .card { background: transparent; border: none; box-shadow: none; padding: 0; backdrop-filter: none; border-radius: 0; border-bottom: 2px solid var(--bg-secondary); padding-bottom: 40px; }
        body.theme-paper h1 { color: #000; background: none; -webkit-text-fill-color: initial; font-size: 3.5rem; letter-spacing: -0.05em; }
        body.theme-paper .stat { background: var(--bg-secondary); border: none; box-shadow: none; }
        body.theme-paper .stat-value { background: none; -webkit-text-fill-color: initial; color: #000; }
        body.theme-paper .experience-item { background: transparent; border: none; border-left: 2px solid #000; border-radius: 0; padding-left: 24px; box-shadow: none; }
        body.theme-paper .experience-item::before { display: none; }
        body.theme-paper .job-title { color: #000; background: none; -webkit-text-fill-color: initial; }
        body.theme-paper .about-text { background: var(--bg-secondary); border: none; border-radius: 4px; }

        /* ================= THEME: COCKPIT HUD ================= */
        body.theme-hud {
            --bg-primary: #050f05;
            --bg-secondary: #0a1a0a;
            --glass-bg: rgba(0, 255, 65, 0.05);
            --glass-border: #003300;
            --text-primary: #00ff41;
            --text-secondary: #00cc33;
            --text-muted: #008822;
        }
        body.theme-hud * { font-family: 'JetBrains Mono', monospace !important; text-transform: uppercase; }
        body.theme-hud::before {
            background: linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; animation: none; width: 100%; height: 100%; top: 0; left: 0; z-index: -1;
        }
        body.theme-hud::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
        body.theme-hud .card { border: 1px solid var(--text-primary); background: rgba(0, 20, 0, 0.8); box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); border-radius: 4px; }
        body.theme-hud .stat-value { background: none; -webkit-text-fill-color: initial; color: var(--text-primary); text-shadow: 0 0 10px rgba(0, 255, 65, 0.8); }
        body.theme-hud h1 { background: none; -webkit-text-fill-color: initial; color: var(--text-primary); text-shadow: 0 0 10px var(--text-primary); }
        body.theme-hud .aircraft-item.current-aircraft { animation: blink 2s infinite; border-color: var(--text-primary); background: var(--text-muted); color: black; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="theme-glass"> <div class="container">
        <header>
            <h1>Noah Mirosch</h1>
            <div class="subtitle">Commercial Pilot</div>
            <div class="credentials">
                <span>CPL / ME-IR</span>
                <span>MPPC</span>
                <span>RU</span>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Flight Time</h2>
                <div class="flight-time-grid">
                    <div class="stat stat-primary">
                        <div class="stat-label">Total Time</div>
                        <div class="stat-value">0.0</div>
                    </div>
                    <div class="stat"><div class="stat-label">PIC</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">Turbine</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">Multi-Eng</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">Night</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">IFR</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">Multi PIC</div><div class="stat-value">0.0</div></div>
                </div>
                <div class="data-note">Loading data...</div>
            </div>

            <div class="card aircraft-card">
                <h2>Aircraft Experience</h2>
                <div class="aircraft-list">
                    </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 28px;">
                <div class="card">
                    <h2>Education</h2>
                    <div id="educationContainer"></div>
                </div>
                <div class="card">
                    <h2>Contact</h2>
                    <div class="contact-grid">
                        <div class="contact-item"><span style="color:var(--text-muted)">Phone:</span> <a href="" id="contactPhone" class="contact-value"></a></div>
                        <div class="contact-item"><span style="color:var(--text-muted)">Email:</span> <a href="" id="contactEmail" class="contact-value"></a></div>
                        <div class="contact-item"><span style="color:var(--text-muted)">LinkedIn:</span> <a href="" id="contactLinkedIn" target="_blank" class="contact-value"></a></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="section">
            <h2 style="text-align: center;">About</h2>
            <div class="about-text" id="aboutText"></div>
        </section>

        <section class="section">
            <h2 style="text-align: center;">Experience</h2>
            <div id="experienceContainer"></div>
        </section>
    </div>

    <div class="aircraft-modal" id="aircraftModal">
        <div class="modal-close" id="modalClose">✕</div>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        // --- 1. Load Aircraft DB ---
        let aircraftDatabase = {};
        async function loadAircraftDatabase() {
            try {
                const response = await fetch('aircraft-database.csv');
                if(!response.ok) return;
                const csvText = await response.text();
                const lines = csvText.trim().split('\n');
                
                // Simple CSV parser
                const headers = lines[0].split(',').map(h => h.trim());
                for(let i=1; i<lines.length; i++) {
                    const row = lines[i];
                    // Handle quoted strings slightly better
                    const values = [];
                    let inQuote = false; 
                    let val = '';
                    for(let char of row) {
                        if(char === '"') { inQuote = !inQuote; }
                        else if(char === ',' && !inQuote) { values.push(val.trim()); val = ''; }
                        else { val += char; }
                    }
                    values.push(val.trim());

                    const aircraft = {};
                    headers.forEach((h, idx) => aircraft[h] = values[idx]);
                    aircraftDatabase[aircraft.type_code] = aircraft;
                }
            } catch(e) { console.log('DB Load Error', e); }
        }

        function createTooltipHTML(type, hours) {
            const ac = aircraftDatabase[type];
            if(!ac) return '';
            // Basic badges
            let badges = '';
            if(ac.is_turbine==='true') badges += '<span style="background:#3b82f633; color:#3b82f6; padding:2px 6px; border-radius:4px; font-size:0.7em; margin-right:4px;">Turbine</span>';
            if(ac.is_multi==='true') badges += '<span style="background:#ec489933; color:#ec4899; padding:2px 6px; border-radius:4px; font-size:0.7em;">Multi</span>';
            
            return `
                <div class="aircraft-tooltip">
                    <div style="font-weight:bold; color:white; margin-bottom:4px;">${ac.name}</div>
                    <div style="font-size:0.8em; color:#888; margin-bottom:8px;">${type} • ${hours} hrs</div>
                    <div style="font-size:0.8em; color:#aaa; line-height:1.4;">${ac.description}</div>
                    <div style="margin-top:10px;">${badges}</div>
                </div>`;
        }

        // --- 2. Main Data Loader ---
        async function loadResumeData() {
    const debugBox = document.createElement('div');
    debugBox.style = "position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,0.8);color:#0f0;padding:10px;font-size:10px;z-index:9999;border:1px solid #0f0;font-family:monospace;max-width:300px;";
    debugBox.innerHTML = "Debug: Initializing...";
    document.body.appendChild(debugBox);

    try {
        debugBox.innerHTML += "<br>Status: Fetching from API...";
        const response = await fetch('https://password-nine-weld.vercel.app/api/resume-data');
        
        if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
        }

        const data = await response.json();
        debugBox.innerHTML += "<br>Status: JSON parsed.";

        if (data) {
            window.lastLoadedData = data;

            // Log the theme for debugging
            debugBox.innerHTML += `<br>Theme: ${data.theme || 'default'}`;
            if (data.theme) document.body.className = data.theme;

            // Check if flight data exists in the object
            if (data.totalTime === undefined) {
                debugBox.innerHTML += "<br><span style='color:red;'>Error: 'totalTime' missing in data!</span>";
                console.error("The data object received does not contain flight hours:", data);
            } else {
                debugBox.innerHTML += `<br>Total Time Found: ${data.totalTime}`;
            }

            // Apply Stats
            const setStat = (idx, val) => {
                const els = document.querySelectorAll('.stat-value');
                if (els[idx]) {
                    const safeVal = (val === undefined || val === null) ? '0.0' : val;
                    els[idx].innerHTML = safeVal.toString().split('').map(c => `<span>${c}</span>`).join('');
                } else {
                    debugBox.innerHTML += `<br>Warn: Element .stat-value[${idx}] not found`;
                }
            };

            setStat(0, data.totalTime);
            const smallStats = document.querySelectorAll('.stat:not(.stat-primary) .stat-value');
            const statsMap = [data.pic, data.turbine, data.multiEngine, data.night, data.ifr || 0, data.multiPIC || 0];
            
            statsMap.forEach((val, i) => {
                if (smallStats[i]) {
                    const safeVal = (val === undefined || val === null) ? '0.0' : val;
                    smallStats[i].innerHTML = safeVal.toString().split('').map(c => `<span>${c}</span>`).join('');
                }
            });

            // Aircraft Experience
            if (data.aircraft && data.aircraft.length > 0) {
                debugBox.innerHTML += `<br>Aircraft Found: ${data.aircraft.length}`;
                renderAircraftList(data);
            } else {
                debugBox.innerHTML += "<br>Warn: No aircraft list in data";
            }

            // Education & Experience (simplified render for debug)
            if (data.education) document.getElementById('educationContainer').innerHTML = "Education items: " + data.education.length;
            if (data.experience) document.getElementById('experienceContainer').innerHTML = "Experience items: " + data.experience.length;

            document.querySelectorAll('.data-note').forEach(el => el.textContent = `Last update: ${data.lastUpdated || 'N/A'}`);
            
            // Hide debug box after 10 seconds if successful
            setTimeout(() => debugBox.style.display = 'none', 10000);

        } else {
            debugBox.innerHTML += "<br>Error: Data object is empty";
        }
    } catch (e) {
        debugBox.style.borderColor = "red";
        debugBox.style.color = "red";
        debugBox.innerHTML += `<br>FATAL ERROR: ${e.message}`;
        console.error("Detailed Error:", e);
    }
}

        // Mobile Modal Logic
        window.openModal = function(type, hours) {
            if(window.innerWidth > 768) return; // Desktop uses hover tooltip
            const html = createTooltipHTML(type, hours);
            const modal = document.getElementById('aircraftModal');
            document.getElementById('modalContent').innerHTML = html.replace('aircraft-tooltip', 'modal-aircraft-tooltip'); // reuse styles roughly
            // fix styles for modal context
            const content = document.getElementById('modalContent').firstElementChild;
            if(content) {
                content.style.position = 'static';
                content.style.opacity = '1';
                content.style.visibility = 'visible';
                content.style.transform = 'none';
                content.style.width = '100%';
            }
            modal.classList.add('active');
        };

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('aircraftModal').classList.remove('active');
        });

        // Initialize
        loadAircraftDatabase().then(loadResumeData);

    </script>
</body>
</html>
