<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noah Mirosch – Commercial Pilot & Aviation Professional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* BASE THEME (Default Glass) */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --accent-orange: #f97316;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; width: 100%; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            width: 100%;
        }

        /* Default Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.1) 0%, transparent 60%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 64px 40px; position: relative; z-index: 1; }
        @media (max-width: 768px) { .container { padding: 40px 20px; } }

        header { text-align: center; margin-bottom: 64px; animation: fadeInDown 0.8s ease-out; }
        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem); font-weight: 700; letter-spacing: -0.03em; margin-bottom: 16px;
            background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { font-size: clamp(1.1rem, 2.5vw, 1.4rem); color: var(--text-secondary); margin-bottom: 12px; }
        .credentials { font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; color: var(--text-muted); margin-top: 20px; }
        .credentials span { display: inline-block; padding: 8px 16px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; margin: 6px; backdrop-filter: blur(10px); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px; margin-bottom: 56px; }
        .card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 32px;
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease-out both;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Liquid glass shimmer effect */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.03),
                transparent
            );
            transform: rotate(45deg);
            transition: all 0.6s ease;
            pointer-events: none;
            will-change: left;
            z-index: -1;
        }

        .card:hover::before {
            left: 100%;
        }

        /* Allow tooltips to overflow aircraft card */
        .card.aircraft-card {
            overflow: visible;
            z-index: 100;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(168, 85, 247, 0.3);
            box-shadow: 
                0 20px 60px rgba(168, 85, 247, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 1;
        }

        .flight-time-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
            margin-bottom: auto;
            align-content: start;
        }

        .stat.stat-primary {
            grid-column: span 2;
            background: rgba(168, 85, 247, 0.1);
            border: 2px solid rgba(168, 85, 247, 0.4);
            padding: 24px 20px;
        }

        .stat.stat-primary:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.6);
        }

        .stat {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .stat:hover {
            background: rgba(168, 85, 247, 0.08);
            border-color: rgba(168, 85, 247, 0.3);
            transform: scale(1.02);
        }

        .stat-primary .stat-label {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 768px) {
            .stat-label {
                font-size: 0.65rem;
                letter-spacing: 0.05em;
            }
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.75rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            user-select: text;
            -webkit-user-select: text;
        }

        .stat-primary .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Airport flip board animation for numbers */
        @keyframes flipIn {
            0% {
                transform: rotateX(90deg);
                opacity: 0;
            }
            50% {
                transform: rotateX(-10deg);
            }
            100% {
                transform: rotateX(0deg);
                opacity: 1;
            }
        }

        /* Wrap each digit/character in a span for individual animation */
        .stat-value span {
            display: inline-block;
            transform-origin: 50% 0%;
            pointer-events: none;
        }

        .stat-value span.flip {
            animation: flipIn 0.8s cubic-bezier(0.4, 0.0, 0.2, 1) both;
        }

        .stat-value span.flip:nth-child(1) { animation-delay: 0.1s; }
        .stat-value span.flip:nth-child(2) { animation-delay: 0.2s; }
        .stat-value span.flip:nth-child(3) { animation-delay: 0.3s; }
        .stat-value span.flip:nth-child(4) { animation-delay: 0.4s; }
        .stat-value span.flip:nth-child(5) { animation-delay: 0.5s; }
        .stat-value span.flip:nth-child(6) { animation-delay: 0.6s; }
        .stat-value span.flip:nth-child(7) { animation-delay: 0.7s; }
        .stat-value span.flip:nth-child(8) { animation-delay: 0.8s; }

        /* Also animate aircraft hours */
        .aircraft-hours span {
            display: inline-block;
            transform-origin: 50% 0%;
            pointer-events: none;
        }

        .aircraft-hours span.flip {
            animation: flipIn 0.8s cubic-bezier(0.4, 0.0, 0.2, 1) both;
        }

        .aircraft-hours span.flip:nth-child(1) { animation-delay: 0.1s; }
        .aircraft-hours span.flip:nth-child(2) { animation-delay: 0.2s; }
        .aircraft-hours span.flip:nth-child(3) { animation-delay: 0.3s; }
        .aircraft-hours span.flip:nth-child(4) { animation-delay: 0.4s; }
        .aircraft-hours span.flip:nth-child(5) { animation-delay: 0.5s; }
        .aircraft-hours span.flip:nth-child(6) { animation-delay: 0.6s; }
        .aircraft-hours span.flip:nth-child(7) { animation-delay: 0.7s; }
        .aircraft-hours span.flip:nth-child(8) { animation-delay: 0.8s; }

        .aircraft-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            margin-bottom: auto;
            align-content: start;
            overflow: visible;
            position: relative;
            z-index: 1;
        }

        .aircraft-item {
            text-align: center;
            padding: 14px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            font-size: 0.875rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            cursor: pointer;
        }

        /* Desktop: add top space for consistent height */
        @media (min-width: 769px) {
            .aircraft-item {
                padding-top: 28px;
            }
        }

        .aircraft-item:hover {
            background: rgba(59, 130, 246, 0.08);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
            z-index: 99999;
        }

        /* SF34 Special Highlight - Current Aircraft */
        .aircraft-item.current-aircraft {
            background: rgba(168, 85, 247, 0.1);
            border: 2px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            animation: pulse-glow 3s ease-in-out infinite;
            position: relative;
        }

        .aircraft-item.current-aircraft:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            z-index: 99999;
        }

        .aircraft-item.current-aircraft .aircraft-type {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* Type Rated banner for SF34 */
        .aircraft-item.current-aircraft::before {
            content: 'TYPE RATED';
            position: absolute;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            font-weight: 700;
            letter-spacing: 0.08em;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
            z-index: 10;
            animation: badgePulse 3s ease-in-out infinite;
        }

        /* Mobile: top-right badge */
        @media (max-width: 768px) {
            .aircraft-item.current-aircraft::before {
                top: -8px;
                right: -8px;
                font-size: 0.6rem;
                padding: 4px 10px;
                border-radius: 8px;
            }
        }

        /* Desktop: elegant top banner */
        @media (min-width: 769px) {
            .aircraft-item.current-aircraft::before {
                top: 0;
                left: 0;
                right: 0;
                font-size: 0.5rem;
                padding: 3px 0;
                border-radius: 10px 10px 0 0;
                text-align: center;
            }
        }

        @keyframes badgePulse {
            0%, 100% { 
                box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
            }
            50% { 
                box-shadow: 0 4px 20px rgba(168, 85, 247, 0.6);
            }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.5); }
        }

        /* Aircraft Info Tooltip */
        .aircraft-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.98), rgba(20, 20, 20, 0.98));
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 16px;
            padding: 20px;
            width: 340px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(20px) saturate(180%);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 999999;
        }

        .aircraft-item:hover .aircraft-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-5px);
        }

        .aircraft-tooltip::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid rgba(168, 85, 247, 0.4);
        }

        .tooltip-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tooltip-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tooltip-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .tooltip-specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .tooltip-spec {
            font-size: 0.75rem;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tooltip-spec-label {
            color: var(--text-muted);
            display: block;
            margin-bottom: 3px;
        }

        .tooltip-spec-value {
            color: var(--text-primary);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .tooltip-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tooltip-badge {
            padding: 4px 10px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            font-size: 0.7rem;
            color: var(--accent-purple);
            font-weight: 500;
        }

        .tooltip-badge.turbine {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
            color: var(--accent-blue);
        }

        .tooltip-badge.multi {
            background: rgba(236, 72, 153, 0.15);
            border-color: rgba(236, 72, 153, 0.3);
            color: var(--accent-pink);
        }

        .tooltip-badge.multicrew {
            background: rgba(249, 115, 22, 0.15);
            border-color: rgba(249, 115, 22, 0.3);
            color: var(--accent-orange);
        }

        /* Mobile fullscreen modal for aircraft tooltips */
        .aircraft-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(60px) saturate(150%);
            -webkit-backdrop-filter: blur(60px) saturate(150%);
            z-index: 999999;
            overflow-y: auto;
            padding: 20px;
            animation: modalFadeIn 0.3s ease-out;
        }

        .aircraft-modal.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-close {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: rotate(90deg);
        }

        .modal-close::before,
        .modal-close::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 2px;
            background: white;
            border-radius: 1px;
        }
        body.theme-paper::before { display: none; }
        body.theme-paper .container { max-width: 800px; background: white; box-shadow: 0 0 50px rgba(0,0,0,0.05); min-height: 100vh; padding-top: 80px; }
        body.theme-paper .grid { display: flex; flex-direction: column; gap: 40px; }
        body.theme-paper .card { background: transparent; border: none; box-shadow: none; padding: 0; backdrop-filter: none; border-radius: 0; border-bottom: 2px solid var(--bg-secondary); padding-bottom: 40px; }
        body.theme-paper h1 { color: #000; background: none; -webkit-text-fill-color: initial; font-size: 3.5rem; letter-spacing: -0.05em; }
        body.theme-paper .stat { background: var(--bg-secondary); border: none; box-shadow: none; }
        body.theme-paper .stat-value { background: none; -webkit-text-fill-color: initial; color: #000; }
        body.theme-paper .experience-item { background: transparent; border: none; border-left: 2px solid #000; border-radius: 0; padding-left: 24px; box-shadow: none; }
        body.theme-paper .experience-item::before { display: none; }
        body.theme-paper .job-title { color: #000; background: none; -webkit-text-fill-color: initial; }
        body.theme-paper .about-text { background: var(--bg-secondary); border: none; border-radius: 4px; }

        /* ================= THEME: COCKPIT HUD ================= */
        body.theme-hud {
            --bg-primary: #050f05;
            --bg-secondary: #0a1a0a;
            --glass-bg: rgba(0, 255, 65, 0.05);
            --glass-border: #003300;
            --text-primary: #00ff41;
            --text-secondary: #00cc33;
            --text-muted: #008822;
        }
        body.theme-hud * { font-family: 'JetBrains Mono', monospace !important; text-transform: uppercase; }
        body.theme-hud::before {
            background: linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; animation: none; width: 100%; height: 100%; top: 0; left: 0; z-index: -1;
        }
        body.theme-hud::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
        body.theme-hud .card { border: 1px solid var(--text-primary); background: rgba(0, 20, 0, 0.8); box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); border-radius: 4px; }
        body.theme-hud .stat-value { background: none; -webkit-text-fill-color: initial; color: var(--text-primary); text-shadow: 0 0 10px rgba(0, 255, 65, 0.8); }
        body.theme-hud h1 { background: none; -webkit-text-fill-color: initial; color: var(--text-primary); text-shadow: 0 0 10px var(--text-primary); }
        body.theme-hud .aircraft-item.current-aircraft { animation: blink 2s infinite; border-color: var(--text-primary); background: var(--text-muted); color: black; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="theme-glass"> <div class="container">
        <header>
            <h1>Noah Mirosch</h1>
            <div class="subtitle">Commercial Pilot</div>
            <div class="credentials" id="certificationBadges">
                <!-- Certification badges will be loaded dynamically -->
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Flight Time</h2>
                <div class="flight-time-grid">
                    <div class="stat stat-primary">
                        <div class="stat-label">Total Time</div>
                        <div class="stat-value">0.0</div>
                    </div>
                    <div class="stat"><div class="stat-label">PIC</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">Turbine</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">Multi-Eng</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">Night</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">IFR</div><div class="stat-value">0.0</div></div>
                    <div class="stat"><div class="stat-label">Multi PIC</div><div class="stat-value">0.0</div></div>
                </div>
                <div class="data-note">Loading data...</div>
            </div>

            <div class="card aircraft-card">
                <h2>Aircraft Experience</h2>
                <div class="aircraft-list">
                    </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 28px;">
                <div class="card">
                    <h2>Education</h2>
                    <div id="educationContainer"></div>
                </div>
                <div class="card">
                    <h2>Contact</h2>
                    <div class="contact-grid" id="contactGrid">
                        <!-- Contact info loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <section class="section">
            <h2 style="text-align: center;">About</h2>
            <div class="about-text" id="aboutText"></div>
        </section>

        <section class="section animate-on-scroll">
            <h2 style="text-align: center; font-size: 1.75rem; margin-bottom: 36px; font-weight: 600; background: linear-gradient(135deg, #ec4899, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Experience</h2>
            <div id="experienceContainer">
                <!-- Experience items will be loaded dynamically -->
            </div>
        </section>
    </div>

    <script>
        // --- 1. Load Aircraft DB ---
        let aircraftDatabase = {};
        async function loadAircraftDatabase() {
            try {
                const response = await fetch('aircraft-database.csv');
                if(!response.ok) return;
                const csvText = await response.text();
                const lines = csvText.trim().split('\n');
                
                // Simple CSV parser
                const headers = lines[0].split(',').map(h => h.trim());
                for(let i=1; i<lines.length; i++) {
                    const row = lines[i];
                    // Handle quoted strings slightly better
                    const values = [];
                    let inQuote = false; 
                    let val = '';
                    for(let char of row) {
                        if(char === '"') { inQuote = !inQuote; }
                        else if(char === ',' && !inQuote) { values.push(val.trim()); val = ''; }
                        else { val += char; }
                    }
                    values.push(val.trim());

                    const aircraft = {};
                    headers.forEach((h, idx) => aircraft[h] = values[idx]);
                    aircraftDatabase[aircraft.type_code] = aircraft;
                }
            } catch(e) { console.log('DB Load Error', e); }
        }

        function createTooltipHTML(type, hours) {
            const ac = aircraftDatabase[type];
            if(!ac) return '';
            // Basic badges
            let badges = '';
            if(ac.is_turbine==='true') badges += '<span style="background:#3b82f633; color:#3b82f6; padding:2px 6px; border-radius:4px; font-size:0.7em; margin-right:4px;">Turbine</span>';
            if(ac.is_multi==='true') badges += '<span style="background:#ec489933; color:#ec4899; padding:2px 6px; border-radius:4px; font-size:0.7em;">Multi</span>';
            
            return `
                <div class="aircraft-tooltip">
                    <div style="font-weight:bold; color:white; margin-bottom:4px;">${ac.name}</div>
                    <div style="font-size:0.8em; color:#888; margin-bottom:8px;">${type} • ${hours} hrs</div>
                    <div style="font-size:0.8em; color:#aaa; line-height:1.4;">${ac.description}</div>
                    <div style="margin-top:10px;">${badges}</div>
                </div>`;
        }

        // --- 2. Main Data Loader ---
        async function loadResumeData() {
            try {
                // Fetch from API
                const response = await fetch('https://password-nine-weld.vercel.app/api/resume-data');
                let data = null;
                if(response.ok) data = await response.json();
                
                // Fallback to local
                if(!data) {
                    const local = localStorage.getItem('noahResumeData');
                    if(local) data = JSON.parse(local);
                }
            }
            
            // Fallback to local JSON file
            if (!data) {
                console.log('Trying resume-data.json file...');
                try {
                    const response = await fetch('resume-data.json');
                    if (response.ok) {
                        data = await response.json();
                        console.log('Loaded data from resume-data.json');
                    }
                } catch (error) {
                    console.log('No resume-data.json file found');
                }
            }
            
            if (data) {
                try {
                    console.log('Applying data to resume...');
                    console.log('Data to apply:', data);
                    
                    // Helper function to wrap each character in a span for flip animation (airport board style)
                    function animateNumber(element, value) {
                        const text = value.toString();
                        element.innerHTML = text.split('').map(char => `<span class="flip">${char}</span>`).join('');
                        element.querySelectorAll('span').forEach(span => {
                            span.addEventListener('animationend', () => {
                                span.classList.remove('flip');
                                // Force final state so parent hover transforms don't trigger re-evaluation
                                span.style.transform = 'rotateX(0deg)';
                                span.style.opacity = '1';
                            }, { once: true });
                        });
                    }
                    
                    // Update flight time stats with flip animation
                    const primaryStat = document.querySelector('.stat-primary .stat-value');
                    console.log('Primary stat element:', primaryStat);
                    if (primaryStat) {
                        animateNumber(primaryStat, data.totalTime);
                        console.log('Set total time to:', data.totalTime);
                    }
                    
                    const stats = document.querySelectorAll('.stat:not(.stat-primary) .stat-value');
                    console.log('Found stat elements:', stats.length);
                    
                    if (stats.length >= 6) {
                        animateNumber(stats[0], data.pic);                    // Row 1 Left - PIC
                        animateNumber(stats[1], data.turbine);                // Row 1 Right - Turbine
                        animateNumber(stats[2], data.multiEngine);            // Row 2 Left - Multi Engine
                        animateNumber(stats[3], data.night);                  // Row 2 Right - Night
                        animateNumber(stats[4], data.ifr || '0.0');           // Row 3 Left - IFR
                        animateNumber(stats[5], data.multiPIC || '0.0');      // Row 3 Right - Multi PIC
                        console.log('Updated all stats with flip animation');
                    }
                    
                    // Update aircraft list
                    const aircraftList = document.querySelector('.aircraft-list');
                    console.log('Aircraft list element:', aircraftList);
                    
                    if (aircraftList && data.aircraft && data.aircraft.length > 0) {
                        aircraftList.innerHTML = data.aircraft.map(a => {
                            const isCurrent = a.type === 'SF34';
                            const tooltip = createAircraftTooltip(a.type, a.hours);
                            
                            // Animate the hours value
                            const hoursText = a.hours.toString();
                            const hoursSpans = hoursText.split('').map(char => `<span class="flip">${char}</span>`).join('');
                            
                            return `
                                <div class="aircraft-item ${isCurrent ? 'current-aircraft' : ''}" 
                                     data-aircraft-type="${a.type}" 
                                     data-aircraft-hours="${a.hours}"
                                     onclick="openAircraftModal('${a.type}', '${a.hours}')">
                                    <span class="aircraft-type">${a.type}</span>
                                    <span class="aircraft-hours">${hoursSpans} hrs</span>
                                    ${tooltip}
                                </div>
                            `;
                        }).join('');
                        // Strip .flip class off aircraft hour spans once they finish
                        aircraftList.querySelectorAll('.aircraft-hours span').forEach(span => {
                            span.addEventListener('animationend', () => {
                                span.classList.remove('flip');
                                // Force final state so hover transforms don't trigger re-evaluation
                                span.style.transform = 'rotateX(0deg)';
                                span.style.opacity = '1';
                            }, { once: true });
                        });
                        console.log('Updated aircraft list with', data.aircraft.length, 'aircraft');
                    }
                    
                    // Update data notes
                    const dateNotes = document.querySelectorAll('.data-note');
                    console.log('Found date note elements:', dateNotes.length);
                    
                    dateNotes.forEach((note, index) => {
                        note.textContent = `Data correct as of ${data.lastUpdated}`;
                        console.log(`Updated date note ${index}`);
                    });
                    
                    // Update Certification Badges
                    if (data.certifications && data.certifications.length > 0) {
                        const badgesContainer = document.getElementById('certificationBadges');
                        badgesContainer.innerHTML = data.certifications
                            .map(cert => `<span>${cert.displayName}</span>`)
                            .join('');
                        console.log('Updated certification badges with', data.certifications.length, 'certifications');
                    } else {
                        // Default badges if none exist
                        document.getElementById('certificationBadges').innerHTML = `
                            <span>CPL / ME-IR</span>
                            <span>MPPC</span>
                            <span>RU</span>
                        `;
                    }
                    
                    // Update Education section
                    if (data.education && data.education.length > 0) {
                        const educationContainer = document.getElementById('educationContainer');
                        const colors = ['var(--accent-purple)', 'var(--accent-blue)', 'var(--accent-pink)'];
                        educationContainer.innerHTML = data.education.map((edu, index) => `
                            <div class="education-item">
                                <div style="font-weight: 600; color: var(--text-primary); font-size: 1.05rem;">${edu.degree}</div>
                                <div style="color: ${colors[index % colors.length]}; font-size: 0.95rem; margin-top: 4px;">${edu.institution}</div>
                                <div style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">${edu.year}</div>
                            </div>
                        `).join('');
                        console.log('Updated education with', data.education.length, 'entries');
                    }
                    
                    // Update Contact section
                    if (data.contact) {
                        const phone = data.contact.phone || '';
                        const email = data.contact.email || '';
                        const linkedin = data.contact.linkedin || '';
                        document.getElementById('contactGrid').innerHTML = `
                            <div class="contact-item">
                                <span class="contact-label">Phone:</span>
                                <a href="tel:${phone.replace(/\s/g, '')}" class="contact-value">${phone}</a>
                            </div>
                            <div class="contact-item">
                                <span class="contact-label">Email:</span>
                                <a href="mailto:${email}" class="contact-value">${email}</a>
                            </div>
                            <div class="contact-item">
                                <span class="contact-label">LinkedIn:</span>
                                <a href="https://linkedin.com/in/${linkedin}" target="_blank" class="contact-value">${linkedin}</a>
                            </div>
                        `;
                        console.log('Updated contact info');
                    }

                    // About
                    if(data.about) document.getElementById('aboutText').innerHTML = data.about.replace(/\n/g, '<br>');

                    // Experience
                    if(data.experience) {
                        document.getElementById('experienceContainer').innerHTML = data.experience.map(exp => `
                            <div class="experience-item">
                                <div class="job-title">${exp.title}</div>
                                <div class="company">${exp.company}</div>
                                <div class="date">${exp.date}</div>
                                <ul>${exp.responsibilities.map(r=>`<li>${r}</li>`).join('')}</ul>
                            </div>
                        `).join('');
                    }

                    document.querySelectorAll('.data-note').forEach(el => el.textContent = `Data correct as of ${data.lastUpdated}`);
                }
            } catch(e) { console.error(e); }
        }

        // Mobile Modal Logic
        window.openModal = function(type, hours) {
            if(window.innerWidth > 768) return; // Desktop uses hover tooltip
            const html = createTooltipHTML(type, hours);
            const modal = document.getElementById('aircraftModal');
            document.getElementById('modalContent').innerHTML = html.replace('aircraft-tooltip', 'modal-aircraft-tooltip'); // reuse styles roughly
            // fix styles for modal context
            const content = document.getElementById('modalContent').firstElementChild;
            if(content) {
                content.style.position = 'static';
                content.style.opacity = '1';
                content.style.visibility = 'visible';
                content.style.transform = 'none';
                content.style.width = '100%';
            }
            modal.classList.add('active');
        };

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('aircraftModal').classList.remove('active');
        });

        // Initialize
        loadAircraftDatabase().then(loadResumeData);

    </script>
</body>
</html>
